# Architecture. AirSim must emit one current depth frame of this resolution.
image_height: 128
image_width: 128
channels: 1
patch_size: 4
latent_dim: 128
encoder_depth: 2
memory_dim: 1024
memory_depth: 1
# Memory output is projected into four 128-D reconstruction codes.
reconstruction_latent_dim: 128
# Hidden width of every spatial patch token inside the one shared decoder.
decoder_embed_dim: 64
# Number of spatial Mamba blocks at EACH pyramid resolution.
decoder_depth: 2
d_state: 16
d_conv: 4
expand: 2
drop_rate: 0.0
drop_path_rate: 0.0

# Offline representation learning.
reconstruction_offsets: [-20, -10, 0, 10]
reconstruction_loss_weights: [0.25, 0.25, 0.15, 0.35]
# Sum squared errors over all valid pixels and samples.
reconstruction_loss: charbonnier
collect_frames: 30000
vision_lr: 0.004
memory_lr: 0.00003
memory_lrf: 0.01  # Stage 4 cosine final LR = memory_lr * memory_lrf.
# Multiplicative learning-rate decay applied after every epoch in stage 3 only.
offline_lr_decay: 0.99
vision_batch_size: 128
# Stage 4 random sampling: n groups per batch, m optimizer updates per epoch.
# Each group contains one current frame and three valid target frames (n x 4).
memory_batch_size: 4        # n; overridden by --batch-size.
memory_validation_interval: 10 # Full validation every N epochs and at the final epoch.

# Frozen-feature SAC.
actor_lr: 0.0004
critic_lr: 0.0004
alpha_lr: 0.0004
hidden_dim: 256
gamma: 0.95
tau: 0.003
initial_alpha: 0.2
auto_entropy: true
batch_size: 256
replay_capacity: 50000
gradient_clip: 10.0

# Success-buffer prioritized replay (same schedule as SB_PER_VSSM_SAC).
sb_per_alpha: 0.6
sb_per_beta0: 0.4
sb_per_beta1: 1.0
sb_per_eps: 0.000001
sb_per_success_capacity_ratio: 0.3
sb_per_success_sample_ratio: 0.30
sb_per_mu_low: 0.30
sb_per_mu_mid: 0.40
sb_per_mu_high: 0.45
sb_per_mu_step1: 0.25
sb_per_mu_step2: 0.70
