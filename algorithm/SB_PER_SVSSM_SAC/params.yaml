# State-Decomposed PER-ST-Vim-SAC algorithm-specific parameters

# SAC parameters
ent_coef: 'auto'
target_entropy: auto
target_update_interval: 1
policy_freq: 1

# State decomposition subnetwork hidden dimensions
sub_visual_hidden: [256, 128]
sub_base_hidden: [64, 32]
sub_out_dim: 3

# Prioritized replay parameters
sb_per_alpha: 0.6
sb_per_beta0: 0.4
sb_per_beta1: 1.0
sb_per_eps: 0.000001
sb_per_success_capacity_ratio: 0.3
sb_per_success_sample_ratio: 0.30
sb_per_mu_low: 0.30
sb_per_mu_mid: 0.40
sb_per_mu_high: 0.45
sb_per_mu_step1: 0.25
sb_per_mu_step2: 0.70

# Vim + temporal Mamba visual encoder parameters
st_mamba_embed_dim: 64
st_mamba_depth: 2
st_mamba_patch_size: 32
st_mamba_d_state: 16
st_mamba_d_conv: 4
st_mamba_expand: 2
st_mamba_drop_rate: 0.05
st_mamba_drop_path_rate: 0.05
st_mamba_temporal_depth: 1
vmconcat_cls_before_temporal_mamba: false
vmflatten_all_tokens: true
