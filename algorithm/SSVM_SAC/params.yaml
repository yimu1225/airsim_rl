# Architecture. AirSim must emit one current depth frame of this resolution.
image_height: 128
image_width: 128
channels: 1
patch_size: 4
latent_dim: 128
encoder_depth: 2
memory_dim: 1024
memory_depth: 4
# Memory output is projected into three 128-D reconstruction codes.
reconstruction_latent_dim: 128
# Hidden width of every spatial patch token inside the one shared decoder.
decoder_embed_dim: 64
# Number of spatial Mamba blocks at EACH pyramid resolution.
decoder_depth: 2
d_state: 16
# SSM state size used only by Temporal Mamba memory.
memory_d_state: 256
d_conv: 4
expand: 2
drop_rate: 0.0
drop_path_rate: 0.0

# Offline representation learning.
reconstruction_offsets: [-5, 0, 5]
# Vision 阶段（单帧自编码器）的重建损失。
vision_reconstruction_loss: mse
# Memory 阶段（时序重建）的重建损失。
reconstruction_loss: mse
# Direct supervision keeps temporal codes on the frozen Vision latent manifold.
memory_latent_loss_weight: 1.0
collect_frames: 30000
vision_lr: 0.005
memory_lr: 0.0005
memory_aux_lr: 0.0003
memory_lrf: 0.01  # Stage 4 cosine final LR = memory_lr * memory_lrf.
vision_lrf: 0.01  # Stage 3 cosine final LR = vision_lr * vision_lrf.
offline_lr_decay: 0.99  # deprecated; vision now uses cosine annealing.
vision_batch_size: 128
# Stage 4 random sampling: n groups per batch, m optimizer updates per epoch.
# Each group contains one current frame and three valid target frames (n x 3).
memory_batch_size: 1       # n; overridden by --batch-size.
memory_validation_interval: 10 # Full validation every N epochs and at the final epoch.

# Frozen-feature SAC.
actor_lr: 0.0004
critic_lr: 0.0004
alpha_lr: 0.0004
hidden_dim: 256
gamma: 0.95
tau: 0.003
initial_alpha: 0.2
auto_entropy: true
batch_size: 256
replay_capacity: 50000
gradient_clip: 10.0

# Success-buffer prioritized replay (same schedule as VSSM-SAC).
sb_per_alpha: 0.6
sb_per_beta0: 0.4
sb_per_beta1: 1.0
sb_per_eps: 0.000001
sb_per_success_capacity_ratio: 0.3
sb_per_success_sample_ratio: 0.30
sb_per_mu_low: 0.30
sb_per_mu_mid: 0.40
sb_per_mu_high: 0.45
sb_per_mu_step1: 0.25
sb_per_mu_step2: 0.70
